name: Post drafts
on:
  # Post drafts for the owner in Russian and Kazakh (DECISIONS.md, 2026-11-12 "Content agent"), Monday, Wednesday and
  # Friday after the daily report: 10:15 UTC = 15:15 Almaty. GitHub sometimes skips or delays a schedule, so there is a
  # later backup; a day already sent is skipped. Nothing is posted anywhere: the drafts go to the owner's Telegram.
  schedule:
    - cron: "15 10 * * 1,3,5"
    - cron: "15 12 * * 1,3,5"
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if today's drafts were already sent"
        type: boolean
        default: false
concurrency: { group: content, cancel-in-progress: false }
permissions:
  contents: read
  actions: read
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Already sent today?
        id: sent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow content.yml --status success --created ">=$(date -u +%F)" --json databaseId --jq length)
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - if: steps.sent.outputs.count == '0' || inputs.force
        uses: actions/checkout@v4
      - if: steps.sent.outputs.count == '0' || inputs.force
        uses: pnpm/action-setup@v4
      - if: steps.sent.outputs.count == '0' || inputs.force
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.sent.outputs.count == '0' || inputs.force
        run: pnpm install --frozen-lockfile
      - if: steps.sent.outputs.count == '0' || inputs.force
        run: pnpm --filter @baga/worker content
        env:
          # The read-only user (migration 0024), in a read-only transaction either way.
          REPORT_DATABASE_URL: ${{ secrets.REPORT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_TELEGRAM_CHAT_ID: ${{ secrets.OWNER_TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://bagaapp.com' }}

name: Black Friday reminder
on:
  # The first sale day (27 Nov 2026), after the store runs (from 08:50 UTC, about 2.5 h): 12:00 UTC = 17:00 Almaty,
  # with a backup an hour and a half later. Each reminder is claimed before it is sent, so the backup never sends twice;
  # on any other day the job sends nothing (DECISIONS.md, 2026-11-15 "Black Friday reminder"). No Kaspi or store request.
  schedule:
    - cron: "0 12 27 11 *"
    - cron: "30 13 27 11 *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Print the message, send nothing"
        type: boolean
        default: false
concurrency: { group: remind, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baga/worker remind ${{ inputs.dry && '--dry' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL || 'https://bagaapp.com' }}

name: Collect prices
on:
  # Once a day. kaspi.kz/robots.txt asks bots to visit 04:00-08:45 UTC (09:00-13:45 Almaty) with a
  # 10 s crawl delay. We keep off the edges: the worker sends requests only 04:05-08:30 UTC (09:05-13:30 Almaty).
  # The job starts at 03:50 UTC and the worker waits for 04:05.
  # See DECISIONS.md "Follow kaspi.kz/robots.txt". Manual runs outside the window exit without requests.
  # GitHub delays scheduled runs under load and sometimes drops them (2 Nov 2026: no 03:50 run at all), so later
  # triggers through the window act as backups. The concurrency group makes them wait for a running collector;
  # once it has stopped at 08:30 they start outside the window (or arrive hours late) and exit without any Kaspi request.
  schedule:
    - cron: "50 3 * * *"
    - cron: "23 4 * * *"
    - cron: "47 5 * * *"
    - cron: "13 7 * * *"
  workflow_dispatch:
concurrency: { group: collect, cancel-in-progress: false } # one collector at a time; later triggers queue
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 20 min wait + 4 h 25 min window + setup; GitHub's job limit is 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          COLLECT_RUNNER: github-actions

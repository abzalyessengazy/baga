name: Collect prices
on:
  # Once a day. kaspi.kz/robots.txt asks bots to visit 04:00-08:45 UTC (09:00-13:45 Almaty) with a
  # 10 s crawl delay. The job starts at 03:50 UTC; the worker waits for 04:00 and stops at 08:45.
  # See DECISIONS.md "Follow kaspi.kz/robots.txt". Manual runs outside the window exit without requests.
  schedule: [{ cron: "50 3 * * *" }]
  workflow_dispatch:
concurrency: { group: collect, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 20 min wait + 4 h 45 min window + setup; GitHub's job limit is 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          COLLECT_RUNNER: github-actions

name: Collect prices
on:
  # Once a day. kaspi.kz/robots.txt asks bots to visit 04:00-08:45 UTC (09:00-13:45 Almaty) with a
  # 10 s crawl delay. We keep off the edges: the worker sends requests only 04:05-08:30 UTC (09:05-13:30 Almaty).
  # The job starts at 03:50 UTC and the worker waits for 04:05.
  # See DECISIONS.md "Follow kaspi.kz/robots.txt". Manual runs outside the window exit without requests.
  # GitHub delays scheduled runs under load and often drops them (2 and 3 Nov 2026: no morning run at all; the
  # triggers arrived at 11:42, 13:52 and 17:04 UTC). So there is a backup trigger every 20 minutes through the
  # window: whichever arrives first collects. While a collector runs, GitHub keeps one later trigger waiting and
  # cancels the others ("cancelled" in the Actions list is expected). A trigger after 08:30 exits within seconds
  # without any Kaspi request.
  # Main trigger since 3 Nov 2026: cron-job.org calls workflow_dispatch at 03:50 UTC plus backups (DECISIONS.md,
  # "External trigger for the collector"). These schedule lines stay as a further backup.
  schedule:
    - cron: "50 3 * * *"
    - cron: "7,27,47 4-7 * * *"
    - cron: "7 8 * * *"
  workflow_dispatch:
concurrency: { group: collect, cancel-in-progress: false } # one collector at a time; later triggers queue
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 20 min wait + 4 h 25 min window + setup; GitHub's job limit is 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }} # public drops channel, e.g. @baga_kz; empty = no post
          TELEGRAM_CHANNEL_LOCALE: ${{ vars.TELEGRAM_CHANNEL_LOCALE }}
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL || 'https://bagaapp.com' }} # 3 Nov 2026: it was saved as a secret; links fell back to localhost
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          COLLECT_RUNNER: github-actions
      # One-off, 9 Nov 2026 only: what else Kaspi's product list can do (sorting, brand and price filters, totals,
      # depth, item fields), 14 requests in 08:31-08:43 UTC after the collector stops at 08:30 (apps/worker/src/
      # probe-scale.ts --set C). Same spacing, User-Agent and stop-on-403/429 rules; nothing is stored. Exits without
      # requests on any other day, or when this run started after 08:32 UTC.
      - name: List capabilities probe (9 Nov only)
        if: ${{ !cancelled() }}
        run: '[ "$(date -u +%F)" = "2026-11-09" ] && pnpm --filter @baga/worker probe:scale --set C --wait || echo "not the probe day"'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: List capabilities responses
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: { name: list-capabilities, path: /tmp/kaspi-C*, if-no-files-found: ignore, retention-days: 14 }
      # One-off, 10 Nov 2026 only: which goods depend on the city (probe-scale.ts --set Y): 26 sellers requests,
      # 6 products x 4 cities, 08:31-08:43 UTC after the collector; nothing stored. Same rules as above.
      - name: City probe (10 Nov only)
        if: ${{ !cancelled() }}
        run: '[ "$(date -u +%F)" = "2026-11-10" ] && pnpm --filter @baga/worker probe:scale --set Y --wait || echo "not the probe day"'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: City probe responses
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: { name: city-probe, path: /tmp/kaspi-Y*, if-no-files-found: ignore, retention-days: 14 }

name: Store prices
on:
  # Other stores' prices for exactly matched products (DECISIONS.md, 2026-11-07 "Technodom as a second price
  # source", 2026-11-14 "Sulpak as a third price source"; CLAUDE.md rule 6a): Technodom, then Sulpak, one at a time. After Kaspi's Visit-time (ends 08:45 UTC), so never at the same time as a Kaspi
  # request: the worker sends requests only 08:46-03:50 UTC, across midnight (13:46-08:50 Almaty), and exits without
  # any otherwise.
  # The main start is cron-job.org's workflow_dispatch at 08:50 UTC (GitHub never fired this schedule on 8 Nov);
  # these are backups (a run with nothing due ends in seconds).
  schedule:
    - cron: "50 8 * * *"
    - cron: "30 10,13,16 * * *"
  workflow_dispatch:
concurrency: { group: stores, cancel-in-progress: false }
permissions:
  contents: read
  actions: write # to start the owner report and the 3-day note when the main run ends
jobs:
  stores:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baga/worker stores
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Signs the list of product pages to rebuild (DECISIONS.md 2026-11-17 "Fewer cache writes").
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL || 'https://bagaapp.com' }}
      # GitHub runs scheduled jobs hours late (14 Nov 2026: the 10:30 UTC note at 16:41), so the main run, started on time
      # by cron-job.org, starts the owner report and the 3-day note itself when it ends (DECISIONS.md, 2026-11-15
      # "Report and 3-day note right after the store run"). Both skip what is done: the report once a day, each note is
      # claimed. Their own schedules stay as backups.
      - name: Start the owner report and the 3-day note
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run report.yml -R "$GITHUB_REPOSITORY"
          gh workflow run nudge.yml -R "$GITHUB_REPOSITORY"

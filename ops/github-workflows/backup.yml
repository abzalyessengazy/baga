name: Nightly backup
on:
  schedule: [{ cron: "17 21 * * *" }] # 02:17 Almaty
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y postgresql-client
      - name: Dump
        run: pg_dump "$DATABASE_URL" --no-owner --format=custom --file=baga-$(date +%F).dump
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - name: Upload to Cloudflare R2
        run: aws s3 cp baga-*.dump "s3://${{ secrets.R2_BUCKET }}/daily/" --endpoint-url "${{ secrets.R2_ENDPOINT }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
